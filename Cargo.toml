[workspace]
members = [
    "crates/quicsync-core",
    "apps/quicsync",
    "apps/quicsyncd",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/domMayhew/QuicSync"
rust-version = "1.85"

[workspace.dependencies]
quicsync-core = { path = "crates/quicsync-core" }
