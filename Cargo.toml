[workspace]
members = [
    "crates/quicsync-core",
    "apps/quicsync",
    "apps/quicsyncd",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/domMayhew/QuicSync"
rust-version = "1.98.1"

[workspace.dependencies]
quicsync-core = { version = "0.1.0", path = "crates/quicsync-core" }
